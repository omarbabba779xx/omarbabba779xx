    <line x1="10" y1="18" x2="22" y2="18"/>
    <line x1="834" y1="12" x2="834" y2="24"/>
    <line x1="828" y1="18" x2="840" y2="18"/>
    <line x1="16" y1="176" x2="16" y2="188"/>
    <line x1="10" y1="182" x2="22" y2="182"/>
    <line x1="834" y1="176" x2="834" y2="188"/>
    <line x1="828" y1="182" x2="840" y2="182"/>
  </g>

  <!-- Top Metadata Bar -->
  <text x="36" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#8b949e">EMSI TANGER · COMPUTER SCIENCE &amp; NETWORKS</text>
  <text x="814" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#58a6ff">SECURITY OPERATIONS &amp; DETECTION</text>


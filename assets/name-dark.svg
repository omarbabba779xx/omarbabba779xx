<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">
  <defs>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#8b949e"/>
      <stop offset="40%" stop-color="#8b949e"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#58a6ff"/>
      <stop offset="60%" stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#8b949e"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="4.5s" repeatCount="indefinite" additive="sum"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.34  0 0 0 0 0.65  0 0 0 0 1  0 0 0 0.55 0" result="tint"/>
      <feMerge>
        <feMergeNode in="tint"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#58a6ff" opacity="0.16"/>
      <animateTransform attributeName="patternTransform" type="translate"
        values="0 0; 26 26" dur="14s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <rect width="760" height="230" fill="url(#grid)"/>

  <circle cx="380" cy="46" r="23" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="380" cy="46" r="19" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.55"/>
  <text x="380" y="53" text-anchor="middle" font-family="Georgia,serif" font-size="17"
        letter-spacing="1" fill="#c9d1d9">OB</text>

  <text x="380" y="128" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif"
        font-size="54" font-weight="300" letter-spacing="14" fill="url(#shine)" filter="url(#glow)">OMAR BABBA</text>

  <line x1="380" y1="160" x2="380" y2="160" stroke="#58a6ff" stroke-width="1" opacity="0.7">
    <animate attributeName="x1" values="380;290" dur="1.1s" begin="0.2s" fill="freeze"/>
    <animate attributeName="x2" values="380;470" dur="1.1s" begin="0.2s" fill="freeze"/>
  </line>

  <text x="380" y="196" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif"
        font-size="12.5" letter-spacing="4.5" fill="#8b949e">SOC JUNIOR · DETECTION ENGINEERING</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="850" height="230" viewBox="0 0 850 230">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="shieldLeftBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="shieldRightBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="goldCyanTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f0f6fc"/>
      <stop offset="70%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="emblemShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>

    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.5" stroke-opacity="0.6"/>
      <circle cx="30" cy="30" r="0.8" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(210px); opacity: 0; }
    }
    .scan-anim { animation: scanLine 6s infinite linear; }
  </style>

  <!-- Container Box with Cyber Border -->
  <rect x="2" y="2" width="846" height="226" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2"/>
  
  <!-- Cyber Background Grid -->
  <rect x="4" y="4" width="842" height="222" rx="12" fill="url(#cyberGrid)"/>

  <!-- Scanning Line Effect -->
  <line x1="10" y1="10" x2="840" y2="10" stroke="url(#glowLine)" stroke-width="1.5" class="scan-anim"/>

  <!-- Top Left Cyber Coordinate HUD -->
  <g opacity="0.85">
    <path d="M 18 34 L 18 18 L 34 18" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="42" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#58a6ff" letter-spacing="1.5">SEC://ID.OMAR_BABBA [EMSI_SOC_UNIT]</text>
  </g>

  <!-- Top Right Status HUD -->
  <g opacity="0.9">
    <path d="M 832 34 L 832 18 L 816 18" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="704" y="16" width="112" height="20" rx="10" fill="#161b22" stroke="#238636" stroke-width="0.8"/>
    <circle cx="718" cy="26" r="3.5" fill="#3fb950"/>
    <text x="728" y="29.5" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#7ee787" font-weight="600" letter-spacing="0.8">SYSTEM ACTIVE</text>
  </g>

  <!-- Bottom Left & Right HUD Corners -->
  <path d="M 18 196 L 18 212 L 34 212" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.75"/>
  <path d="M 832 196 L 832 212 L 816 212" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.75"/>

  <!-- Luxury 3D Faceted Cybersecurity Shield Crest -->
  <g transform="translate(425, 48)" filter="url(#emblemShadow)">
    <!-- Radial Core Halo -->
    <circle cx="0" cy="5" r="28" fill="url(#coreGlow)"/>

    <!-- Left Shield Facet (Dark Obsidian) -->
    <path d="M 0 -22 L -24 -12 L -24 8 C -24 22 -12 34 0 40 Z" 
          fill="url(#shieldLeftBevel)" stroke="url(#goldCyanTrim)" stroke-width="1.2"/>

    <!-- Right Shield Facet (Matte Titanium Highlight) -->
    <path d="M 0 -22 L 24 -12 L 24 8 C 24 22 12 34 0 40 Z" 
          fill="url(#shieldRightBevel)" stroke="url(#goldCyanTrim)" stroke-width="1.2"/>

    <!-- Center Facet Spine -->
    <line x1="0" y1="-22" x2="0" y2="40" stroke="#00f2fe" stroke-width="1.4" opacity="0.8"/>

    <!-- Micro-Circuit Nodes on Wings -->
    <circle cx="-14" cy="0" r="1.5" fill="#38bdf8"/>
    <line x1="-14" y1="0" x2="-8" y2="5" stroke="#38bdf8" stroke-width="0.8" opacity="0.7"/>
    <circle cx="14" cy="0" r="1.5" fill="#38bdf8"/>
    <line x1="14" y1="0" x2="8" y2="5" stroke="#38bdf8" stroke-width="0.8" opacity="0.7"/>

    <!-- Luxury Cryptographic Diamond Core -->
    <path d="M 0 -5 L 9 5 L 0 15 L -9 5 Z" fill="#090d16" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="0" cy="5" r="3" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="0" cy="5" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Main Name Title -->
  <text x="425" y="118" text-anchor="middle" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="42" font-weight="800" letter-spacing="10" fill="url(#textShine)" filter="url(#glow)">OMAR BABBA</text>

  <!-- Subtitle Terminal Badge (Clean, Centered, No Overlaps) -->
  <g transform="translate(425, 152)">
    <rect x="-350" y="-14" width="700" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- Left terminal prompt accent -->
    <text x="-332" y="3.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">&gt;_</text>
    <!-- Centered subtitle text with generous padding -->
    <text x="0" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" 
          font-size="11" font-weight="600" letter-spacing="2" fill="#a5d6ff">
      DEFENSIVE CYBERSECURITY <tspan fill="#38bdf8">·</tspan> SOC OPERATIONS <tspan fill="#38bdf8">·</tspan> DETECTION ENGINEERING
    </text>
  </g>

  <!-- Bottom Focus Ribbon (Fully Centered Coordinates) -->
  <g transform="translate(425, 196)">
    <!-- Pill 1 -->
    <g transform="translate(-215, 0)">
      <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="-75" cy="0" r="3" fill="#58a6ff"/>
      <text x="5" y="3.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c9d1d9" font-weight="500">SIEM / SOAR Pipeline</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 0)">
      <rect x="-100" y="-12" width="200" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="-80" cy="0" r="3" fill="#38bdf8"/>
      <text x="5" y="3.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c9d1d9" font-weight="500">MITRE ATT&amp;CK &amp; Sigma</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(215, 0)">
      <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="-75" cy="0" r="3" fill="#a371f7"/>
      <text x="5" y="3.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c9d1d9" font-weight="500">Malware &amp; Traffic DFIR</text>
    </g>
  </g>
</svg>

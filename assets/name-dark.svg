<svg xmlns="http://www.w3.org/2000/svg" width="850" height="175" viewBox="0 0 850 175">
  <defs>
    <linearGradient id="bannerBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="accentLineDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Clean Container -->
  <rect x="1" y="1" width="848" height="173" rx="8" fill="url(#bannerBgDark)" stroke="#30363d" stroke-width="1"/>

  <!-- Subtle Top Accent Line -->
  <line x1="40" y1="1" x2="810" y2="1" stroke="url(#accentLineDark)" stroke-width="1.5"/>

  <!-- Category Overline -->
  <g transform="translate(425, 36)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" 
          font-size="10" font-weight="600" letter-spacing="2.5" fill="#8b949e">
      DEFENSIVE CYBERSECURITY · SOC OPERATIONS · DETECTION ENGINEERING
    </text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(425, 78)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" 
          font-size="34" font-weight="700" letter-spacing="1" fill="#f0f6fc">
      Omar Babba
    </text>
  </g>

  <!-- Bio Subtitle -->
  <g transform="translate(425, 106)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="13" font-weight="400" fill="#a5d6ff">
      Engineering Student at EMSI Tanger · SIEM/SOAR Automation · DFIR &amp; Threat Hunting
    </text>
  </g>

  <!-- Clean Professional Competency Tags -->
  <g transform="translate(425, 142)">
    <!-- Tag 1 -->
    <g transform="translate(-210, 0)">
      <rect x="-85" y="-11" width="170" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="0" y="3.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="10" font-weight="500" fill="#c9d1d9">SIEM / SOAR Pipelines</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-11" width="190" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="0" y="3.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="10" font-weight="500" fill="#c9d1d9">SigmaHQ &amp; MITRE ATT&amp;CK</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(210, 0)">
      <rect x="-85" y="-11" width="170" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="0" y="3.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="10" font-weight="500" fill="#c9d1d9">Malware &amp; Traffic DFIR</text>
    </g>

<svg xmlns="http://www.w3.org/2000/svg" width="850" height="230" viewBox="0 0 850 230">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f0f6fc"/>
      <stop offset="70%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.5" stroke-opacity="0.6"/>
      <circle cx="30" cy="30" r="0.8" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(210px); opacity: 0; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }
    .pulse-glow { animation: pulseGlow 4s infinite ease-in-out; }
    .scan-anim { animation: scanLine 6s infinite linear; }
    .beacon { animation: beaconBlink 2s infinite ease-in-out; transform-origin: 142px 198px; }
  </style>

  <!-- Container Box with Cyber Border -->
  <rect x="2" y="2" width="846" height="226" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2"/>
  
  <!-- Cyber Background Grid -->
  <rect x="4" y="4" width="842" height="222" rx="12" fill="url(#cyberGrid)"/>

  <!-- Scanning Line Effect -->
  <line x1="10" y1="10" x2="840" y2="10" stroke="url(#glowLine)" stroke-width="1.5" class="scan-anim"/>

  <!-- Top Left Cyber Coordinate HUD -->
  <g opacity="0.75">
    <path d="M 18 34 L 18 18 L 34 18" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="42" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#58a6ff" letter-spacing="1.5">SEC://ID.OMAR_BABBA [EMSI_SOC_UNIT]</text>
  </g>

  <!-- Top Right Status HUD -->
  <g opacity="0.85">
    <path d="M 832 34 L 832 18 L 816 18" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="704" y="16" width="102" height="18" rx="9" fill="#161b22" stroke="#238636" stroke-width="0.8"/>
    <circle cx="715" cy="25" r="3.5" fill="#3fb950"/>
    <text x="724" y="28" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#7ee787" font-weight="600" letter-spacing="0.8">SYSTEM ACTIVE</text>
  </g>

  <!-- Bottom Left & Right HUD Corners -->
  <path d="M 18 196 L 18 212 L 34 212" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.75"/>
  <path d="M 832 196 L 832 212 L 816 212" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.75"/>

  <!-- Central Shield Badge -->
  <g transform="translate(425, 48)">
    <path d="M 0 -22 L 20 -13 L 20 6 C 20 20 10 31 0 37 C -10 31 -20 20 -20 6 L -20 -13 Z" 
          fill="#161b22" stroke="url(#cyanBlue)" stroke-width="1.6"/>
    <!-- Inner lock / check icon -->
    <path d="M -8 -2 L -8 -7 C -8 -11.5 -4.5 -15 0 -15 C 4.5 -15 8 -11.5 8 -7 L 8 -2 Z" 
          fill="none" stroke="#38bdf8" stroke-width="1.6"/>
    <rect x="-10" y="-2" width="20" height="15" rx="3" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="5" r="2" fill="#38bdf8"/>
  </g>

  <!-- Main Name Title -->
  <text x="425" y="125" text-anchor="middle" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" font-weight="800" letter-spacing="11" fill="url(#textShine)" filter="url(#glow)">OMAR BABBA</text>

  <!-- Subtitle with Glowing HUD brackets -->
  <g>
    <!-- Left Bracket -->
    <path d="M 175 148 L 165 148 L 165 168 L 175 168" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.85"/>
    
    <!-- Badges Row -->
    <text x="425" y="161" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" 
          font-size="12" font-weight="600" letter-spacing="3" fill="#a5d6ff">
      DEFENSIVE CYBERSECURITY <tspan fill="#38bdf8">·</tspan> SOC OPERATIONS <tspan fill="#38bdf8">·</tspan> DETECTION ENGINEERING
    </text>
    
    <!-- Right Bracket -->
    <path d="M 675 148 L 685 148 L 685 168 L 675 168" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.85"/>
  </g>

  <!-- Bottom Interactive Focus Ribbon -->
  <g transform="translate(425, 196)">
    <!-- Pill 1 -->
    <rect x="-300" y="-12" width="185" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="-288" cy="-1" r="3" fill="#58a6ff"/>
    <text x="-278" y="3" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c9d1d9" font-weight="500">SIEM / SOAR Pipeline</text>

    <!-- Pill 2 -->
    <rect x="-95" y="-12" width="190" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="-83" cy="-1" r="3" fill="#38bdf8"/>
    <text x="-73" y="3" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c9d1d9" font-weight="500">MITRE ATT&amp;CK &amp; Sigma</text>

    <!-- Pill 3 -->
    <rect x="115" y="-12" width="185" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="127" cy="-1" r="3" fill="#a371f7"/>
    <text x="137" y="3" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c9d1d9" font-weight="500">Malware &amp; Traffic DFIR</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="850" height="160" viewBox="0 0 850 160">
  <defs>
    <linearGradient id="pipeBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="activeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2433"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>

    <filter id="glowPacket" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes movePulse {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .pulse-dot {
      offset-path: path("M 70 70 L 210 70 L 350 70 L 490 70 L 630 70 L 770 70");
      animation: movePulse 4.5s infinite linear;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="156" rx="12" fill="url(#pipeBgDark)" stroke="#30363d" stroke-width="1.2"/>

  <!-- Top Title Tag -->
  <g transform="translate(425, 20)">
    <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" 
          font-size="9.5" font-weight="700" letter-spacing="2.5" fill="#58a6ff">
      SOC OPERATIONAL LIFECYCLE · EVENT TO REMEDIATION
    </text>
  </g>

  <!-- Connecting Bus Line -->
  <line x1="70" y1="70" x2="770" y2="70" stroke="#21262d" stroke-width="3"/>
  <line x1="70" y1="70" x2="770" y2="70" stroke="url(#activeLine)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Traveling Pulse Packet -->
  <circle r="5" fill="#00f2fe" filter="url(#glowPacket)" class="pulse-dot"/>

  <!-- Node 1: INGEST -->
  <g transform="translate(70, 70)">
    <rect x="-48" y="-30" width="96" height="60" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="-28" cy="-14" r="3" fill="#58a6ff"/>
    <text x="-18" y="-11" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">INGEST</text>
    <text x="-38" y="5" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">EVTX · Sysmon</text>
    <text x="-38" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">PCAP · Zeek</text>
  </g>

  <!-- Node 2: DETECT -->
  <g transform="translate(210, 70)">
    <rect x="-48" y="-30" width="96" height="60" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="-28" cy="-14" r="3" fill="#38bdf8"/>
    <text x="-18" y="-11" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">DETECT</text>
    <text x="-38" y="5" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">SigmaHQ Rules</text>
    <text x="-38" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">MITRE ATT&amp;CK</text>
  </g>

  <!-- Node 3: TRIAGE -->
  <g transform="translate(350, 70)">
    <rect x="-48" y="-30" width="96" height="60" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="-28" cy="-14" r="3" fill="#818cf8"/>
    <text x="-18" y="-11" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">TRIAGE</text>
    <text x="-38" y="5" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">Deduplication</text>
    <text x="-38" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">Severity Route</text>
  </g>

  <!-- Node 4: INVESTIGATE -->
  <g transform="translate(490, 70)">
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="-32" cy="-14" r="3" fill="#a78bfa"/>
    <text x="-22" y="-11" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f0f6fc" letter-spacing="0.3">INVESTIGATE</text>
    <text x="-40" y="5" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">REMnux · Sandbx</text>
    <text x="-40" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">Wireshark DFIR</text>
  </g>

  <!-- Node 5: RESPOND -->
  <g transform="translate(630, 70)">
    <rect x="-48" y="-30" width="96" height="60" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="-28" cy="-14" r="3" fill="#c084fc"/>
    <text x="-18" y="-11" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">RESPOND</text>
    <text x="-38" y="5" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">SOAR Playbooks</text>
    <text x="-38" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">Containment</text>
  </g>

  <!-- Node 6: REPORT -->
  <g transform="translate(770, 70)">
    <rect x="-48" y="-30" width="96" height="60" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="-28" cy="-14" r="3" fill="#34d399"/>
    <text x="-18" y="-11" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">REPORT</text>
    <text x="-38" y="5" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">STIX 2.1 / IOCs</text>
    <text x="-38" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e">Post-Mortem</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(425, 142)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#6e7681">
      End-to-End Threat Detection, Triage Automation, Malware Extraction &amp; Incident Verification
    </text>
  </g>
</svg>

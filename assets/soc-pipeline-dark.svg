<svg xmlns="http://www.w3.org/2000/svg" width="850" height="155" viewBox="0 0 850 155">
  <defs>
    <linearGradient id="pipeBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="streamLineDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Clean Container -->
  <rect x="1" y="1" width="848" height="153" rx="8" fill="url(#pipeBgDark)" stroke="#30363d" stroke-width="1"/>

  <!-- Top Header Title -->
  <g transform="translate(425, 22)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="9.5" font-weight="600" letter-spacing="2" fill="#8b949e">
      DETECTION &amp; RESPONSE WORKFLOW · SOC ALERT LIFECYCLE
    </text>
  </g>

  <!-- Bus Line Track -->
  <line x1="70" y1="68" x2="770" y2="68" stroke="#21262d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Streaming Flow Animation -->
  <line x1="70" y1="68" x2="770" y2="68" stroke="url(#streamLineDark)" stroke-width="1.8" stroke-dasharray="8,6">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- Clean Signal Indicator (Subtle Muted Blue) -->
  <circle r="4" fill="#58a6ff">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M 70,68 L 210,68 L 350,68 L 490,68 L 630,68 L 770,68" />
    <animate attributeName="opacity" values="0;1;1;1;1;1;0" keyTimes="0;0.05;0.3;0.6;0.85;0.95;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Stage 1: Ingest -->
  <g transform="translate(70, 68)">
    <rect x="-52" y="-30" width="104" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="-36" y="-12" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#58a6ff">01</text>
    <text x="-16" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#f0f6fc">INGEST</text>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">Sysmon · EVTX</text>
    <text x="0" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">Zeek · PCAP</text>
  </g>

  <!-- Flow Arrow 1-2 -->
  <path d="M 137 64 L 142 68 L 137 72" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Stage 2: Detect -->
  <g transform="translate(210, 68)">
    <rect x="-52" y="-30" width="104" height="60" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
    <text x="-36" y="-12" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#58a6ff">02</text>
    <text x="-16" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#f0f6fc">DETECT</text>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">SigmaHQ Rules</text>
    <text x="0" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">MITRE ATT&amp;CK</text>
  </g>

  <!-- Flow Arrow 2-3 -->
  <path d="M 277 64 L 282 68 L 277 72" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Stage 3: Triage -->
  <g transform="translate(350, 68)">
    <rect x="-52" y="-30" width="104" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="-36" y="-12" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#58a6ff">03</text>
    <text x="-16" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#f0f6fc">TRIAGE</text>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">Deduplication</text>
    <text x="0" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">Severity Route</text>
  </g>

  <!-- Flow Arrow 3-4 -->
  <path d="M 417 64 L 422 68 L 417 72" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Stage 4: Investigate -->
  <g transform="translate(490, 68)">
    <rect x="-54" y="-30" width="108" height="60" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
    <text x="-40" y="-12" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#58a6ff">04</text>
    <text x="-20" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#f0f6fc">INVESTIGATE</text>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">REMnux Sandbox</text>
    <text x="0" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">Wireshark DFIR</text>
  </g>

  <!-- Flow Arrow 4-5 -->
  <path d="M 557 64 L 562 68 L 557 72" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Stage 5: Respond -->
  <g transform="translate(630, 68)">
    <rect x="-52" y="-30" width="104" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="-36" y="-12" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#58a6ff">05</text>
    <text x="-16" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#f0f6fc">RESPOND</text>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">SOAR Playbooks</text>
    <text x="0" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">Containment</text>
  </g>

  <!-- Flow Arrow 5-6 -->
  <path d="M 697 64 L 702 68 L 697 72" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Stage 6: Report -->
  <g transform="translate(770, 68)">
    <rect x="-52" y="-30" width="104" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="-36" y="-12" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#58a6ff">06</text>
    <text x="-16" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#f0f6fc">REPORT</text>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">STIX 2.1 / IOCs</text>
    <text x="0" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#8b949e">Post-Mortem</text>
  </g>

  <!-- Bottom Subtitle Bar -->
  <g transform="translate(425, 137)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#8b949e">
      Telemetry Ingestion ▹ Automated Correlation ▹ Forensic Investigation ▹ Orchestrated Mitigation
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="850" height="215" viewBox="0 0 850 215">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="cyanBlueLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="50%" stop-color="#0550ae"/>
      <stop offset="100%" stop-color="#1f883d"/>
    </linearGradient>

    <linearGradient id="textShineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="glowLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0969da" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <pattern id="cyberGridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.7"/>
      <circle cx="30" cy="30" r="0.8" fill="#0969da" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    @keyframes scanLineLight {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.5; }
      80% { opacity: 0.5; }
      100% { transform: translateY(195px); opacity: 0; }
    }
    .scan-anim-light { animation: scanLineLight 6s infinite linear; }
  </style>

  <!-- Container Box with Clean Border -->
  <rect x="2" y="2" width="846" height="211" rx="12" fill="url(#bgGradLight)" stroke="#cbd5e1" stroke-width="1.2"/>
  
  <!-- Cyber Background Grid -->
  <rect x="4" y="4" width="842" height="207" rx="10" fill="url(#cyberGridLight)"/>

  <!-- Scanning Line Effect -->
  <line x1="10" y1="10" x2="840" y2="10" stroke="url(#glowLineLight)" stroke-width="1.5" class="scan-anim-light"/>

  <!-- Top Left Cyber Coordinate HUD -->
  <g opacity="0.9">
    <path d="M 18 34 L 18 18 L 34 18" fill="none" stroke="#0969da" stroke-width="1.8"/>
    <text x="42" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" font-weight="600" fill="#0969da" letter-spacing="1.5">SEC://ID.OMAR_BABBA [EMSI_SOC_UNIT]</text>
  </g>

  <!-- Top Right Status HUD -->
  <g opacity="0.95">
    <path d="M 832 34 L 832 18 L 816 18" fill="none" stroke="#0969da" stroke-width="1.8"/>
    <rect x="704" y="16" width="112" height="20" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="0.8"/>
    <circle cx="718" cy="26" r="3.5" fill="#16a34a"/>
    <text x="728" y="29.5" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#15803d" font-weight="600" letter-spacing="0.8">SYSTEM ACTIVE</text>
  </g>

  <!-- Bottom Left & Right HUD Corners -->
  <path d="M 18 181 L 18 197 L 34 197" fill="none" stroke="#0969da" stroke-width="1.8" opacity="0.75"/>
  <path d="M 832 181 L 832 197 L 816 197" fill="none" stroke="#0969da" stroke-width="1.8" opacity="0.75"/>

  <!-- Hero Name Title -->
  <text x="425" y="94" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="46" font-weight="800" letter-spacing="12" fill="url(#textShineLight)">OMAR BABBA</text>

  <!-- Subtitle Terminal Badge -->
  <g transform="translate(425, 132)">
    <rect x="-350" y="-14" width="700" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Left terminal prompt accent -->
    <text x="-332" y="3.5" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#0969da">&gt;_</text>
    <!-- Centered subtitle text -->
    <text x="0" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" 
          font-size="11" font-weight="600" letter-spacing="2" fill="#0369a1">
      DEFENSIVE CYBERSECURITY <tspan fill="#64748b">·</tspan> SOC OPERATIONS <tspan fill="#64748b">·</tspan> DETECTION ENGINEERING
    </text>
  </g>

  <!-- Bottom Focus Ribbon -->
  <g transform="translate(425, 178)">
    <!-- Pill 1 -->
    <g transform="translate(-215, 0)">
      <rect x="-95" y="-11" width="190" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="-75" cy="0" r="3" fill="#0284c7"/>
      <text x="5" y="3.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#334155" font-weight="500">SIEM / SOAR Pipelines</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 0)">
      <rect x="-100" y="-11" width="200" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="-80" cy="0" r="3" fill="#0969da"/>
      <text x="5" y="3.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#334155" font-weight="500">SigmaHQ &amp; MITRE ATT&amp;CK</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(215, 0)">
      <rect x="-95" y="-11" width="190" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="-75" cy="0" r="3" fill="#7c3aed"/>
      <text x="5" y="3.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#334155" font-weight="500">Malware &amp; Traffic DFIR</text>
    </g>
  </g>
</svg>

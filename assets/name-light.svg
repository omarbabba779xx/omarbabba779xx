<svg xmlns="http://www.w3.org/2000/svg" width="850" height="230" viewBox="0 0 850 230">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f3f6"/>
    </linearGradient>

    <linearGradient id="shieldLeftBevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="shieldRightBevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="goldCyanTrimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="50%" stop-color="#0550ae"/>
      <stop offset="100%" stop-color="#1f883d"/>
    </linearGradient>

    <radialGradient id="coreGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0969da" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textShineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2328"/>
      <stop offset="45%" stop-color="#24292f"/>
      <stop offset="70%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#0550ae"/>
    </linearGradient>

    <linearGradient id="glowLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0969da" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0550ae" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0550ae" stop-opacity="0"/>
    </linearGradient>

    <pattern id="cyberGridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#d0d7de" stroke-width="0.6" stroke-opacity="0.5"/>
      <circle cx="30" cy="30" r="0.8" fill="#0969da" fill-opacity="0.25"/>
    </pattern>

    <filter id="emblemShadowLight" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0969da" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    @keyframes scanLineLight {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(210px); opacity: 0; }
    }
    .scan-anim-light { animation: scanLineLight 6s infinite linear; }
  </style>

  <!-- Container Box with Clean Border -->
  <rect x="2" y="2" width="846" height="226" rx="14" fill="url(#bgGradLight)" stroke="#d0d7de" stroke-width="1.2"/>
  
  <!-- Cyber Background Grid -->
  <rect x="4" y="4" width="842" height="222" rx="12" fill="url(#cyberGridLight)"/>

  <!-- Scanning Line Effect -->
  <line x1="10" y1="10" x2="840" y2="10" stroke="url(#glowLineLight)" stroke-width="1.5" class="scan-anim-light"/>

  <!-- Top Left Cyber Coordinate HUD -->
  <g opacity="0.85">
    <path d="M 18 34 L 18 18 L 34 18" fill="none" stroke="#0969da" stroke-width="1.8"/>
    <text x="42" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#0969da" letter-spacing="1.5">SEC://ID.OMAR_BABBA [EMSI_SOC_UNIT]</text>
  </g>

  <!-- Top Right Status HUD -->
  <g opacity="0.9">
    <path d="M 832 34 L 832 18 L 816 18" fill="none" stroke="#0969da" stroke-width="1.8"/>
    <rect x="704" y="16" width="112" height="20" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="0.8"/>
    <circle cx="718" cy="26" r="3.5" fill="#1a7f37"/>
    <text x="728" y="29.5" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#1a7f37" font-weight="600" letter-spacing="0.8">SYSTEM ACTIVE</text>
  </g>

  <!-- Bottom Left & Right HUD Corners -->
  <path d="M 18 196 L 18 212 L 34 212" fill="none" stroke="#0969da" stroke-width="1.8" opacity="0.85"/>
  <path d="M 832 196 L 832 212 L 816 212" fill="none" stroke="#0969da" stroke-width="1.8" opacity="0.85"/>

  <!-- Luxury 3D Faceted Cybersecurity Shield Crest -->
  <g transform="translate(425, 48)" filter="url(#emblemShadowLight)">
    <!-- Radial Core Halo -->
    <circle cx="0" cy="5" r="28" fill="url(#coreGlowLight)"/>

    <!-- Left Shield Facet -->
    <path d="M 0 -22 L -24 -12 L -24 8 C -24 22 -12 34 0 40 Z" 
          fill="url(#shieldLeftBevelLight)" stroke="url(#goldCyanTrimLight)" stroke-width="1.2"/>

    <!-- Right Shield Facet -->
    <path d="M 0 -22 L 24 -12 L 24 8 C 24 22 12 34 0 40 Z" 
          fill="url(#shieldRightBevelLight)" stroke="url(#goldCyanTrimLight)" stroke-width="1.2"/>

    <!-- Center Facet Spine -->
    <line x1="0" y1="-22" x2="0" y2="40" stroke="#0969da" stroke-width="1.4" opacity="0.8"/>

    <!-- Micro-Circuit Nodes on Wings -->
    <circle cx="-14" cy="0" r="1.5" fill="#0969da"/>
    <line x1="-14" y1="0" x2="-8" y2="5" stroke="#0969da" stroke-width="0.8" opacity="0.7"/>
    <circle cx="14" cy="0" r="1.5" fill="#0969da"/>
    <line x1="14" y1="0" x2="8" y2="5" stroke="#0969da" stroke-width="0.8" opacity="0.7"/>

    <!-- Luxury Cryptographic Diamond Core -->
    <path d="M 0 -5 L 9 5 L 0 15 L -9 5 Z" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <circle cx="0" cy="5" r="3" fill="#0969da"/>
    <circle cx="0" cy="5" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Main Name Title -->
  <text x="425" y="118" text-anchor="middle" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="42" font-weight="800" letter-spacing="10" fill="url(#textShineLight)">OMAR BABBA</text>

  <!-- Subtitle Terminal Badge (Clean, Centered, No Overlaps) -->
  <g transform="translate(425, 152)">
    <rect x="-350" y="-14" width="700" height="28" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <!-- Left terminal prompt accent -->
    <text x="-332" y="3.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0969da">&gt;_</text>
    <!-- Centered subtitle text with generous padding -->
    <text x="0" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" 
          font-size="11" font-weight="600" letter-spacing="2" fill="#0969da">
      DEFENSIVE CYBERSECURITY <tspan fill="#57606a">·</tspan> SOC OPERATIONS <tspan fill="#57606a">·</tspan> DETECTION ENGINEERING
    </text>
  </g>

  <!-- Bottom Focus Ribbon (Fully Centered Coordinates) -->
  <g transform="translate(425, 196)">
    <!-- Pill 1 -->
    <g transform="translate(-215, 0)">
      <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="-75" cy="0" r="3" fill="#0969da"/>
      <text x="5" y="3.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#24292f" font-weight="500">SIEM / SOAR Pipeline</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 0)">
      <rect x="-100" y="-12" width="200" height="24" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="-80" cy="0" r="3" fill="#0550ae"/>
      <text x="5" y="3.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#24292f" font-weight="500">MITRE ATT&amp;CK &amp; Sigma</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(215, 0)">
      <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="-75" cy="0" r="3" fill="#8250df"/>
      <text x="5" y="3.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#24292f" font-weight="500">Malware &amp; Traffic DFIR</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="850" height="200" viewBox="0 0 850 200">
  <defs>
    <linearGradient id="termBgLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <linearGradient id="headerGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f3f6"/>
      <stop offset="100%" stop-color="#e6ebf1"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Outer Container -->
  <rect x="1" y="1" width="848" height="198" rx="10" fill="url(#termBgLight)" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- Terminal Header Title Bar -->
  <path d="M 1 11 C 1 5.5 5.5 1 11 1 L 839 1 C 844.5 1 849 5.5 849 11 L 849 38 L 1 38 Z" fill="url(#headerGradLight)" stroke="#d0d7de" stroke-width="1.2"/>
  <line x1="1" y1="38" x2="849" y2="38" stroke="#d0d7de" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="22" cy="20" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="39" cy="20" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="56" cy="20" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Terminal Title -->
  <text x="425" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="500" fill="#57606a">
    omar@emsi-soc: ~ /identity (zsh)
  </text>

  <!-- Status Pill -->
  <g transform="translate(800, 20)">
    <circle cx="-65" cy="0" r="3.5" fill="#1a7f37"/>
    <text x="-55" y="3.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#1a7f37" letter-spacing="0.5">ACTIVE</text>
  </g>

  <!-- Command Line Prompt -->
  <g transform="translate(28, 62)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#1a7f37">omar@emsi-soc</text>
    <text x="110" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="400" fill="#57606a">:</text>
    <text x="120" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#0969da">~</text>
    <text x="132" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="400" fill="#57606a">$</text>
    <text x="146" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500" fill="#24292f">cat whoami.txt</text>
  </g>

  <!-- Hero Name -->
  <g transform="translate(28, 106)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" 
          font-size="36" font-weight="800" letter-spacing="0.5" fill="#1f2328">
      Omar Babba
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(28, 132)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="13.5" font-weight="500" fill="#0969da">
      Defensive Cybersecurity &amp; SOC Detection Engineer
    </text>
    <text x="360" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="13.5" font-weight="400" fill="#57606a">
      · 4th-Year Computer Science &amp; Networks @ EMSI Tanger
    </text>
  </g>

  <!-- Focus Tags -->
  <g transform="translate(28, 168)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-11" width="162" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="81" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#24292f">SIEM / SOAR Pipeline</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(172, 0)">
      <rect x="0" y="-11" width="176" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="88" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#24292f">SigmaHQ &amp; ATT&amp;CK</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(358, 0)">
      <rect x="0" y="-11" width="176" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="88" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#24292f">Malware Sandbox DFIR</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(544, 0)">
      <rect x="0" y="-11" width="154" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="77" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#24292f">Network Forensics</text>
    </g>

    <!-- Tag 5 -->
    <g transform="translate(708, 0)">
      <rect x="0" y="-11" width="112" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
      <text x="56" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#1a7f37">Internship Ready</text>
    </g>
  </g>
</svg>

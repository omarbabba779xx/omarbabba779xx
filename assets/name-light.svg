<svg xmlns="http://www.w3.org/2000/svg" width="850" height="230" viewBox="0 0 850 230">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f3f6"/>
    </linearGradient>

    <linearGradient id="cyanBlueLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="50%" stop-color="#0550ae"/>
      <stop offset="100%" stop-color="#1f883d"/>
    </linearGradient>

    <linearGradient id="textShineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2328"/>
      <stop offset="45%" stop-color="#24292f"/>
      <stop offset="70%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#0550ae"/>
    </linearGradient>

    <linearGradient id="glowLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0969da" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0550ae" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0550ae" stop-opacity="0"/>
    </linearGradient>

    <pattern id="cyberGridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#d0d7de" stroke-width="0.6" stroke-opacity="0.5"/>
      <circle cx="30" cy="30" r="0.8" fill="#0969da" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes scanLineLight {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(210px); opacity: 0; }
    }
    .scan-anim-light { animation: scanLineLight 6s infinite linear; }
  </style>

  <!-- Container Box with Clean Border -->
  <rect x="2" y="2" width="846" height="226" rx="14" fill="url(#bgGradLight)" stroke="#d0d7de" stroke-width="1.2"/>
  
  <!-- Cyber Background Grid -->
  <rect x="4" y="4" width="842" height="222" rx="12" fill="url(#cyberGridLight)"/>

  <!-- Scanning Line Effect -->
  <line x1="10" y1="10" x2="840" y2="10" stroke="url(#glowLineLight)" stroke-width="1.5" class="scan-anim-light"/>

  <!-- Top Left Cyber Coordinate HUD -->
  <g opacity="0.85">
    <path d="M 18 34 L 18 18 L 34 18" fill="none" stroke="#0969da" stroke-width="1.8"/>
    <text x="42" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#0969da" letter-spacing="1.5">SEC://ID.OMAR_BABBA [EMSI_SOC_UNIT]</text>
  </g>

  <!-- Top Right Status HUD -->
  <g opacity="0.9">
    <path d="M 832 34 L 832 18 L 816 18" fill="none" stroke="#0969da" stroke-width="1.8"/>
    <rect x="704" y="16" width="102" height="18" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="0.8"/>
    <circle cx="715" cy="25" r="3.5" fill="#1a7f37"/>
    <text x="724" y="28" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" fill="#1a7f37" font-weight="600" letter-spacing="0.8">SYSTEM ACTIVE</text>
  </g>

  <!-- Bottom Left & Right HUD Corners -->
  <path d="M 18 196 L 18 212 L 34 212" fill="none" stroke="#0969da" stroke-width="1.8" opacity="0.85"/>
  <path d="M 832 196 L 832 212 L 816 212" fill="none" stroke="#0969da" stroke-width="1.8" opacity="0.85"/>

  <!-- Central Shield Badge -->
  <g transform="translate(425, 48)">
    <path d="M 0 -22 L 20 -13 L 20 6 C 20 20 10 31 0 37 C -10 31 -20 20 -20 6 L -20 -13 Z" 
          fill="#f6f8fa" stroke="url(#cyanBlueLight)" stroke-width="1.6"/>
    <!-- Inner lock / check icon -->
    <path d="M -8 -2 L -8 -7 C -8 -11.5 -4.5 -15 0 -15 C 4.5 -15 8 -11.5 8 -7 L 8 -2 Z" 
          fill="none" stroke="#0969da" stroke-width="1.6"/>
    <rect x="-10" y="-2" width="20" height="15" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <circle cx="0" cy="5" r="2" fill="#0969da"/>
  </g>

  <!-- Main Name Title -->
  <text x="425" y="125" text-anchor="middle" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" font-weight="800" letter-spacing="11" fill="url(#textShineLight)">OMAR BABBA</text>

  <!-- Subtitle with HUD brackets -->
  <g>
    <!-- Left Bracket -->
    <path d="M 175 148 L 165 148 L 165 168 L 175 168" fill="none" stroke="#0969da" stroke-width="1.4" opacity="0.85"/>
    
    <!-- Badges Row -->
    <text x="425" y="161" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" 
          font-size="12" font-weight="600" letter-spacing="3" fill="#0969da">
      DEFENSIVE CYBERSECURITY <tspan fill="#57606a">·</tspan> SOC OPERATIONS <tspan fill="#57606a">·</tspan> DETECTION ENGINEERING
    </text>
    
    <!-- Right Bracket -->
    <path d="M 675 148 L 685 148 L 685 168 L 675 168" fill="none" stroke="#0969da" stroke-width="1.4" opacity="0.85"/>
  </g>

  <!-- Bottom Interactive Focus Ribbon -->
  <g transform="translate(425, 196)">
    <!-- Pill 1 -->
    <rect x="-300" y="-12" width="185" height="22" rx="11" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="-288" cy="-1" r="3" fill="#0969da"/>
    <text x="-278" y="3" font-family="'Segoe UI', sans-serif" font-size="10" fill="#24292f" font-weight="500">SIEM / SOAR Pipeline</text>

    <!-- Pill 2 -->
    <rect x="-95" y="-12" width="190" height="22" rx="11" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="-83" cy="-1" r="3" fill="#0550ae"/>
    <text x="-73" y="3" font-family="'Segoe UI', sans-serif" font-size="10" fill="#24292f" font-weight="500">MITRE ATT&amp;CK &amp; Sigma</text>

    <!-- Pill 3 -->
    <rect x="115" y="-12" width="185" height="22" rx="11" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="127" cy="-1" r="3" fill="#8250df"/>
    <text x="137" y="3" font-family="'Segoe UI', sans-serif" font-size="10" fill="#24292f" font-weight="500">Malware &amp; Traffic DFIR</text>
  </g>
</svg>

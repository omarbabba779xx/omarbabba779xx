<svg xmlns="http://www.w3.org/2000/svg" width="850" height="165" viewBox="0 0 850 165">
  <defs>
    <linearGradient id="pipeBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="activeLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="20%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#16a34a"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="80%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <linearGradient id="cardGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="161" rx="12" fill="url(#pipeBgLight)" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Top Title Header -->
  <g transform="translate(425, 23)">
    <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" 
          font-size="9.5" font-weight="700" letter-spacing="2.5" fill="#0969da">
      DETECTION &amp; RESPONSE WORKFLOW · REAL-TIME ALERT LIFECYCLE
    </text>
  </g>

  <!-- Base Bus Track -->
  <line x1="70" y1="73" x2="770" y2="73" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>

  <!-- Animated Streaming Dashed Flow Line -->
  <line x1="70" y1="73" x2="770" y2="73" stroke="url(#activeLineLight)" stroke-width="2" stroke-dasharray="10,6">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Primary Traveling Alert Pulse (SMIL Native Motion) -->
  <circle r="5" fill="#0969da">
    <animateMotion dur="3.5s" repeatCount="indefinite"
      path="M 70,73 L 210,73 L 350,73 L 490,73 L 630,73 L 770,73" />
    <animate attributeName="opacity" values="0;1;1;1;1;1;0" keyTimes="0;0.05;0.3;0.6;0.85;0.95;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Secondary Trailing Glow Halo -->
  <circle r="8" fill="#0284c7" opacity="0.3">
    <animateMotion dur="3.5s" repeatCount="indefinite"
      path="M 70,73 L 210,73 L 350,73 L 490,73 L 630,73 L 770,73" />
    <animate attributeName="opacity" values="0;0.4;0.4;0.4;0.4;0.4;0" keyTimes="0;0.05;0.3;0.6;0.85;0.95;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1: INGEST -->
  <g transform="translate(70, 73)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="-34" cy="-14" r="3.5" fill="#0969da">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.08;0.16"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.08;0.16"/>
    </circle>
    <text x="-24" y="-10.5" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" letter-spacing="0.5">INGEST</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">EVTX · Sysmon</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">PCAP · Zeek</text>
  </g>

  <!-- Flow Directional Forward Arrow 1 -> 2 -->
  <path d="M 137 68 L 143 73 L 137 78" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  <!-- Node 2: DETECT -->
  <g transform="translate(210, 73)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#0969da" stroke-width="1.2"/>
    <circle cx="-34" cy="-14" r="3.5" fill="#0969da">
      <animate attributeName="r" values="3.5;3.5;5.5;3.5;3.5" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.15;0.25;0.35;1"/>
      <animate attributeName="opacity" values="0.7;0.7;1;0.7;0.7" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.15;0.25;0.35;1"/>
    </circle>
    <text x="-24" y="-10.5" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" letter-spacing="0.5">DETECT</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">SigmaHQ Rules</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">MITRE ATT&amp;CK</text>
  </g>

  <!-- Flow Directional Forward Arrow 2 -> 3 -->
  <path d="M 277 68 L 283 73 L 277 78" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  <!-- Node 3: TRIAGE -->
  <g transform="translate(350, 73)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="-34" cy="-14" r="3.5" fill="#0284c7">
      <animate attributeName="r" values="3.5;3.5;5.5;3.5;3.5" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.55;1"/>
      <animate attributeName="opacity" values="0.7;0.7;1;0.7;0.7" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.55;1"/>
    </circle>
    <text x="-24" y="-10.5" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" letter-spacing="0.5">TRIAGE</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">Deduplication</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">Severity Route</text>
  </g>

  <!-- Flow Directional Forward Arrow 3 -> 4 -->
  <path d="M 417 68 L 423 73 L 417 78" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  <!-- Node 4: INVESTIGATE -->
  <g transform="translate(490, 73)">
    <rect x="-54" y="-32" width="108" height="64" rx="8" fill="url(#cardGradLight)" stroke="#7c3aed" stroke-width="1.2"/>
    <circle cx="-42" cy="-14" r="3.5" fill="#7c3aed">
      <animate attributeName="r" values="3.5;3.5;5.5;3.5;3.5" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.55;0.65;0.75;1"/>
      <animate attributeName="opacity" values="0.7;0.7;1;0.7;0.7" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.55;0.65;0.75;1"/>
    </circle>
    <text x="-32" y="-10.5" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" letter-spacing="0.3">INVESTIGATE</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">REMnux Sandbx</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">Wireshark DFIR</text>
  </g>

  <!-- Flow Directional Forward Arrow 4 -> 5 -->
  <path d="M 557 68 L 563 73 L 557 78" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  <!-- Node 5: RESPOND -->
  <g transform="translate(630, 73)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="-34" cy="-14" r="3.5" fill="#db2777">
      <animate attributeName="r" values="3.5;3.5;5.5;3.5;3.5" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.75;0.85;0.95;1"/>
      <animate attributeName="opacity" values="0.7;0.7;1;0.7;0.7" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.75;0.85;0.95;1"/>
    </circle>
    <text x="-24" y="-10.5" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" letter-spacing="0.5">RESPOND</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">SOAR Playbooks</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">Containment</text>
  </g>

  <!-- Flow Directional Forward Arrow 5 -> 6 -->
  <path d="M 697 68 L 703 73 L 697 78" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  <!-- Node 6: REPORT -->
  <g transform="translate(770, 73)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="-34" cy="-14" r="3.5" fill="#15803d">
      <animate attributeName="r" values="3.5;3.5;5.5;3.5;3.5" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.9;0.98;1"/>
      <animate attributeName="opacity" values="0.7;0.7;1;0.7;0.7" dur="3.5s" repeatCount="indefinite" keyTimes="0;0.9;0.98;1"/>
    </circle>
    <text x="-24" y="-10.5" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" letter-spacing="0.5">REPORT</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">STIX 2.1 / IOCs</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">Post-Mortem</text>
  </g>

  <!-- Bottom Subtitle Bar -->
  <g transform="translate(425, 146)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b" letter-spacing="0.5">
      Continuous Signal Ingestion ▹ Automated Correlation ▹ Forensic Investigation ▹ Orchestrated Response
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="850" height="160" viewBox="0 0 850 160">
  <defs>
    <linearGradient id="pipeBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="activeLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="35%" stop-color="#0550ae"/>
      <stop offset="70%" stop-color="#8250df"/>
      <stop offset="100%" stop-color="#bf3989"/>
    </linearGradient>

    <linearGradient id="cardGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes movePulseLight {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .pulse-dot-light {
      offset-path: path("M 70 70 L 210 70 L 350 70 L 490 70 L 630 70 L 770 70");
      animation: movePulseLight 4.5s infinite linear;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="156" rx="12" fill="url(#pipeBgLight)" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- Top Title Tag -->
  <g transform="translate(425, 20)">
    <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" 
          font-size="9.5" font-weight="700" letter-spacing="2.5" fill="#0969da">
      SOC OPERATIONAL LIFECYCLE · EVENT TO REMEDIATION
    </text>
  </g>

  <!-- Connecting Bus Line -->
  <line x1="70" y1="70" x2="770" y2="70" stroke="#d0d7de" stroke-width="3"/>
  <line x1="70" y1="70" x2="770" y2="70" stroke="url(#activeLineLight)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Traveling Pulse Packet -->
  <circle r="5" fill="#0969da" class="pulse-dot-light"/>

  <!-- Node 1: INGEST -->
  <g transform="translate(70, 70)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#d0d7de" stroke-width="1.2"/>
    <circle cx="-32" cy="-14" r="3" fill="#0969da"/>
    <text x="-22" y="-10.5" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#1f2328" letter-spacing="0.5">INGEST</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">EVTX · Sysmon</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">PCAP · Zeek</text>
  </g>

  <!-- Node 2: DETECT -->
  <g transform="translate(210, 70)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#0969da" stroke-width="1.2"/>
    <circle cx="-32" cy="-14" r="3" fill="#0969da"/>
    <text x="-22" y="-10.5" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#1f2328" letter-spacing="0.5">DETECT</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">SigmaHQ Rules</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">MITRE ATT&amp;CK</text>
  </g>

  <!-- Node 3: TRIAGE -->
  <g transform="translate(350, 70)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#d0d7de" stroke-width="1.2"/>
    <circle cx="-32" cy="-14" r="3" fill="#0550ae"/>
    <text x="-22" y="-10.5" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#1f2328" letter-spacing="0.5">TRIAGE</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">Deduplication</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">Severity Route</text>
  </g>

  <!-- Node 4: INVESTIGATE -->
  <g transform="translate(490, 70)">
    <rect x="-54" y="-32" width="108" height="64" rx="8" fill="url(#cardGradLight)" stroke="#8250df" stroke-width="1.2"/>
    <circle cx="-42" cy="-14" r="3" fill="#8250df"/>
    <text x="-32" y="-10.5" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#1f2328" letter-spacing="0.3">INVESTIGATE</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">REMnux Sandbx</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">Wireshark DFIR</text>
  </g>

  <!-- Node 5: RESPOND -->
  <g transform="translate(630, 70)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#d0d7de" stroke-width="1.2"/>
    <circle cx="-32" cy="-14" r="3" fill="#bf3989"/>
    <text x="-22" y="-10.5" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#1f2328" letter-spacing="0.5">RESPOND</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">SOAR Playbooks</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">Containment</text>
  </g>

  <!-- Node 6: REPORT -->
  <g transform="translate(770, 70)">
    <rect x="-52" y="-32" width="104" height="64" rx="8" fill="url(#cardGradLight)" stroke="#d0d7de" stroke-width="1.2"/>
    <circle cx="-32" cy="-14" r="3" fill="#1a7f37"/>
    <text x="-22" y="-10.5" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#1f2328" letter-spacing="0.5">REPORT</text>
    <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">STIX 2.1 / IOCs</text>
    <text x="0" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#57606a">Post-Mortem</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(425, 142)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#57606a">
      End-to-End Threat Detection, Triage Automation, Malware Extraction &amp; Incident Verification
    </text>
  </g>
</svg>
